BasedOnStyle: LLVM
IndentWidth: 4
TabWidth: 4
UseTab: Never
BreakBeforeBraces: Allman
AccessModifierOffset: -4
MaxEmptyLinesToKeep: 1
SeparateDefinitionBlocks: Always
SortIncludes: CaseSensitive
IncludeBlocks: Regroup
IncludeCategories:
  - Regex: '^<.*>'
    Priority: 1
    SortPriority: 1
  - Regex: '^".*"'
    Priority: 1
    SortPriority: 2
